    <path d="M52 0v20" stroke="#333" stroke-opacity=".28"/>
    <text x="26" y="14" fill="#fff" font-family="Verdana,Arial,sans-serif" font-size="11" text-anchor="middle">Python</text>
    <text x="72" y="14" fill="#fff" font-family="Verdana,Arial,sans-serif" font-size="11" text-anchor="middle">3.13</text>
  </g>
  <rect x=".5" y=".5" width="91" height="19" rx="3" fill="none" stroke="#000" stroke-opacity=".18"/>
</svg>
