<svg xmlns="http://www.w3.org/2000/svg" width="92" height="20" viewBox="0 0 92 20" role="img" aria-label="Python 3.13">
  <defs>
    <clipPath id="badge-shape">
      <rect width="92" height="20" rx="3"/>
    </clipPath>
    <linearGradient id="label" x2="0" y2="1">
      <stop stop-color="#7F7F7F"/>
      <stop offset=".58" stop-color="#585858"/>
      <stop offset="1" stop-color="#515151"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#D1BA7A"/>
      <stop offset=".58" stop-color="#B79D58"/>
      <stop offset="1" stop-color="#AD9246"/>
