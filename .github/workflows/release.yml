name: Build and publish release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$project_version" || {
            echo "Tag $GITHUB_REF_NAME não corresponde à versão $project_version do pyproject.toml." >&2
            exit 1
          }

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Download appimagetool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-tools
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output build-tools/appimagetool-x86_64.AppImage
          chmod +x build-tools/appimagetool-x86_64.AppImage

      - name: Build AppImage
        shell: bash
        env:
          OSA_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export OSA_VERSION="${OSA_VERSION#v}"
          ./scripts/build-linux-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          if-no-files-found: error
          path: dist/*.AppImage

  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Validate release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -ne $projectVersion) {
            throw "Tag $env:GITHUB_REF_NAME não corresponde à versão $projectVersion do pyproject.toml."
          }

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        env:
          OSA_VERSION: ${{ github.ref_name }}
        run: |
          $env:OSA_VERSION = $env:OSA_VERSION.Substring(1)
          .\scripts\build-windows-installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: dist/*-Setup.exe

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    needs:
      - build-linux-appimage
      - build-windows-installer

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(release-assets/*.AppImage)
          installers=(release-assets/*-Setup.exe)
          test "${#appimages[@]}" -eq 1
          test "${#installers[@]}" -eq 1
          sha256sum "${appimages[@]}" "${installers[@]}" > release-assets/SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Open Structural Analysis $version" \
            --generate-notes \
            release-assets/*
